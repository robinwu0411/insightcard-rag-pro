name: Build and Deploy Backend
on:
  push:
    paths:
      - "backend/**"
      - "shared/**"
      - "infra/**"
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push backend image
        run: |
          docker build -t insightcard-rag/backend:latest -f backend/Dockerfile .
          docker tag insightcard-rag/backend:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/insightcard-rag/backend:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/insightcard-rag/backend:latest

      - name: Build and push ingestion image
        run: |
          docker build -t insightcard-rag/ingestion:latest -f ingestion/Dockerfile .
          docker tag insightcard-rag/ingestion:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/insightcard-rag/ingestion:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/insightcard-rag/ingestion:latest

      - name: Update ECS services
        run: |
          aws ecs update-service --cluster insightcard-rag-prod --service insightcard-rag-backend --force-new-deployment
          aws ecs update-service --cluster insightcard-rag-prod --service insightcard-rag-ingestion --force-new-deployment
